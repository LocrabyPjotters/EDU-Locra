events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/json;

    # Optimalisaties voor ultra-lage latency streaming
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip uitschakelen voor Server-Sent Events (SSE) streaming om buffering te voorkomen
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_proxied any;

    upstream privai_backend {
        server privai-gateway:4100;
        keepalive 32;
    }

    server {
        listen 80;
        server_name api.privai.locra.nl _;

        # Client body grootte voor grote RAG context windows (15MB)
        client_max_body_size 15M;

        # ─── PrivAI Gateway API (OpenAI & Claude Drop-in) ───
        location / {
            proxy_pass http://privai_backend;
            proxy_http_version 1.1;

            # CRITIEK VOOR REALTIME TOKEN STREAMING (SSE):
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # Timeouts voor lange redeneer-chains van 70B modellen
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Doorgeven van client IP voor rate-limiting
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Security Headers (Zero Access & Strict Transport)
            add_header X-Locra-PrivAI-Enclave "AMD-SEV-SNP-Verified" always;
            add_header X-Locra-Datacenter "Equinix AM4, Amsterdam Science Park (NL)" always;
            add_header X-Zero-Logging "0 Bytes Prompt Retained" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Healthcheck endpoint
        location /health {
            proxy_pass http://privai_backend/;
            proxy_http_version 1.1;
        }
    }
}

